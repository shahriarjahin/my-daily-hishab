name: Android release build
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      HISHAB_BACKEND_URL: ${{ vars.HISHAB_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Python build dependencies
        run: pip install -r requirements.txt
      - name: Install React and Capacitor dependencies
        run: npm ci --prefix frontend
      - name: Install native inference build tools
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Validate React transport
        run: npm test --prefix frontend
      - name: Validate the offline ledger
        run: |
          node --test mobile/test_ledger.cjs
          python -m unittest mobile.test_compatibility -v
      - name: Validate cloud security and financial writes
        run: python -m unittest backend.test_api backend.test_app backend.test_finance backend.test_integrations backend.test_security backend.test_account_updates backend.test_audit_fixes
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import base64,os
          from pathlib import Path
          key=os.environ.get('KEYSTORE_BASE64','')
          if not key:raise SystemExit('Configure Android signing secrets described in mobile/README.md.')
          folder=Path('mobile/release-keys');folder.mkdir(parents=True,exist_ok=True)
          (folder/'hishab-release.p12').write_bytes(base64.b64decode(key))
          (folder/'signing.properties').write_text('keyAlias=hishab\nstorePassword='+os.environ['KEYSTORE_PASSWORD']+'\nkeyPassword='+os.environ['KEY_PASSWORD']+'\n')
          PY
      - name: Build signed APK and Android App Bundle
        run: python mobile/build.py --ci
      - name: Upload private build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hishab-android-release
          path: mobile/dist/*
          retention-days: 30
